name: Build and Deploy Bebas QC

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'services/backend/**'
            frontend:
              - 'services/frontend/**'
            infrastructure:
              - 'docker/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'

      - name: Set up Lowercase Repository Env
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        if: steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      # Backend Build and Push
      - name: Build and Push Go Backend Image
        if: steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/bebas-qc/backend:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/bebas-qc/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Frontend Build and Push
      - name: Build and Push React Frontend Image
        if: steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/bebas-qc/frontend:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/bebas-qc/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    if: |
      always() &&
      (needs.build-and-push.outputs.backend == 'true' ||
       needs.build-and-push.outputs.frontend == 'true' ||
       needs.build-and-push.outputs.infrastructure == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: g3rald_dj
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the app directory
            cd ~/bebas-qc

            # Sync code configurations
            git pull origin main

            # Capture the postgres volume name dynamically before shutting down
            POSTGRES_VOL=$(docker inspect --format '{{ range .Mounts }}{{ if eq .Destination "/var/lib/postgresql/data" }}{{ .Name }}{{ end }}{{ end }}' bebasqc_postgres 2>/dev/null || true)

            # Stop the compose stack to release volume locks
            docker compose down

            # Remove the postgres volume to clear the database
            if [ -n "$POSTGRES_VOL" ]; then
              docker volume rm "$POSTGRES_VOL" 2>/dev/null || true
            fi
            docker volume rm bebas-qc_postgres_data bebasqc_postgres_data 2>/dev/null || true

            # Pull latest pre-built images from GHCR
            docker compose pull

            # Re-create modified containers in detached mode without rebuilding locally
            docker compose up -d --no-build

            # Clean up obsolete images
            docker image prune -f

            # Perform post-deployment health check with retries
            echo "Performing post-deploy health check..."
            for i in {1..15}; do
              if curl -s -f http://localhost/api/health > /dev/null; then
                echo "Deployment successfully verified! Web app is healthy."
                exit 0
              fi
              echo "Waiting for service to start (attempt $i/15)..."
              sleep 4
            done
            echo "Error: Post-deployment health check failed!"
            exit 1
