upstream frontend{
    server frontend:80;
}

upstream backend{
    server backend:8080;
}

# 1. Redirect IP address (or any other domain) to the proper domain
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 http://bebasqc.geraldmanurung.site$request_uri;
    }
}

# 2. Serve bebasqc.geraldmanurung.site on HTTP (handles Let's Encrypt challenge)
server {
    listen 80;
    server_name bebasqc.geraldmanurung.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/roboflow/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

