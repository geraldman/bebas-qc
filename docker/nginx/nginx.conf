upstream frontend{
    server frontend:80;
}

upstream backend{
    server backend:8080;
}

# Redirect HTTP to HTTPS & Let's Encrypt Challenge Handler
server {
    listen 80;
    server_name bebasqc.yourdomain.com; # Replace with your subdomain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

